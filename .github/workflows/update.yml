name: Opdater kommuneplan-status

on:
  workflow_dispatch:

  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: write

jobs:
  update:

    runs-on: ubuntu-latest

    steps:

      - name: Hent repository
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer pakker
        run: |
          pip install pandas requests

      - name: Kør script
        run: |
          python Digitale_kommuneplaner_og_tillaeg.py

      - name: Commit ændringer
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          git diff --staged --quiet || git commit -m "Automatisk ugentlig opdatering"

          git push
